name: Qualify and release products

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build products
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      MAVEN_GITHUB_USERNAME: ${{ secrets.MAVEN_GITHUB_USERNAME }}
      MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must follow vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must reference a commit from main" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Maven 3.9.16
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          curl -fsSLO https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz.sha512
          echo "$(cat apache-maven-3.9.16-bin.tar.gz.sha512)  apache-maven-3.9.16-bin.tar.gz" | sha512sum --check -
          tar -xzf apache-maven-3.9.16-bin.tar.gz
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.9.16/bin/mvn" --version

      - name: Configure package registries
        run: |
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server><id>github</id><username>${{ github.actor }}</username><password>${{ github.token }}</password></server>
              <server><id>github-sirius-emfjson</id><username>x-access-token</username><password>${{ github.token }}</password></server>
              <server><id>github-sirius-web</id><username>x-access-token</username><password>${{ github.token }}</password></server>
              <server><id>github-syson</id><username>x-access-token</username><password>${{ github.token }}</password></server>
              <server><id>github-capella-for-syson</id><username>x-access-token</username><password>${{ github.token }}</password></server>
            </servers>
          </settings>
          EOF

      - name: Qualify build and Linux and Windows products for Capella 7.1.0
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Pcapella-product-7.1.0
          clean verify

      - name: Upload build qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-qualification-evidence-7.1.0
          path: |
            eclipse/official-product-it/target/failsafe-reports/
            eclipse/official-product-it/target/runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare distributions
        shell: bash
        run: |
          install -D \
            eclipse/product/org.eclipse.capella.sysmlv2.bridge.product.7.1.0/target/products/org.eclipse.capella.sysmlv2.bridge.product.7.1.0-linux.gtk.x86_64.tar.gz \
            dist/capella2sysmlv2-Capella.7.1.0-linux-x86_64.tar.gz
          install -D \
            eclipse/product/org.eclipse.capella.sysmlv2.bridge.product.7.1.0/target/products/org.eclipse.capella.sysmlv2.bridge.product.7.1.0-win32.win32.x86_64.zip \
            dist/capella2sysmlv2-Capella.7.1.0-windows-x86_64.zip
          install -D \
            eclipse/official-product-it/target/runtime/standalone/ife.zip \
            dist/InFlightEntertainmentSystem.zip

      - name: Qualify build and Linux and Windows products for Capella 7.0.1
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Pcapella-product-7.0.1
          clean verify

      - name: Upload build qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-qualification-evidence-7.0.1
          path: |
            eclipse/official-product-it/target/failsafe-reports/
            eclipse/official-product-it/target/runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare distributions
        shell: bash
        run: |
          install -D \
            eclipse/product/org.eclipse.capella.sysmlv2.bridge.product.7.0.1/target/products/org.eclipse.capella.sysmlv2.bridge.product.7.0.1-linux.gtk.x86_64.tar.gz \
            dist/capella2sysmlv2-Capella.7.0.1-linux-x86_64.tar.gz
          install -D \
            eclipse/product/org.eclipse.capella.sysmlv2.bridge.product.7.0.1/target/products/org.eclipse.capella.sysmlv2.bridge.product.7.0.1-win32.win32.x86_64.zip \
            dist/capella2sysmlv2-Capella.7.0.1-windows-x86_64.zip
          install -D \
            eclipse/official-product-it/target/runtime/standalone/ife.zip \
            dist/InFlightEntertainmentSystem.zip

      # - name: Qualify build and Linux and Windows products for Capella 6.1.0
      #   run: >-
      #     mvn --batch-mode --no-transfer-progress
      #     -Pcapella-product-6.1.0
      #     clean verify

      # - name: Upload build qualification evidence
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-qualification-evidence
      #     path: |
      #       eclipse/official-product-it/target/failsafe-reports/
      #       eclipse/official-product-it/target/runtime/
      #     if-no-files-found: ignore
      #     retention-days: 7

      # - name: Prepare distributions
      #   shell: bash
      #   run: |
      #     install -D \
      #       eclipse/product/org.eclipse.capella.sysmlv2.bridge.product.6.1.0/target/products/org.eclipse.capella.sysmlv2.bridge.product.6.1.0-linux.gtk.x86_64.tar.gz \
      #       dist/capella2sysmlv2-Capella.6.1.0-linux-x86_64.tar.gz
      #     install -D \
      #       eclipse/product/org.eclipse.capella.sysmlv2.bridge.product.6.1.0/target/products/org.eclipse.capella.sysmlv2.bridge.product.6.1.0-win32.win32.x86_64.zip \
      #       dist/capella2sysmlv2-Capella.6.1.0-windows-x86_64.zip
      #     install -D \
      #       eclipse/official-product-it/target/runtime/standalone/ife.zip \
      #       dist/InFlightEntertainmentSystem.zip

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: capella2sysmlv2-products
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke-test-linux:
    name: Test Linux product
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: capella2sysmlv2-products
          path: dist

      - name: Extract Linux product
        run: |
          mkdir product
          tar -xzf dist/capella2sysmlv2-Capella.7.1.0-linux-x86_64.tar.gz -C product
          chmod +x product/capella2sysmlv2

      - name: Transform IFE sample
        shell: bash
        run: |
          set -o pipefail
          env -u DISPLAY ./product/capella2sysmlv2 \
            -vm "$JAVA_HOME/bin/java" \
            dist/InFlightEntertainmentSystem.zip output 2>&1 | tee run.log
          grep -F "Source LogicalComponent count: 23" run.log
          grep -F "Source Entity count: 8" run.log
          grep -F "Source SystemComponent count: 5" run.log
          grep -F "Source PhysicalComponent count: 64" run.log
          grep -F "Generated PartUsage count: 100" run.log
          grep -F "Errors: 0" run.log
          grep -F "Capella Transformation Coverage:" run.log
          grep -F "Arcadia SysML v2 Library Utilization:" run.log
          grep -F "Arcadia SysML v2 Library Coverage of Capella:" run.log
          test -f "output/In-Flight Entertainment System.sysml.xmi"
          test -f "output/.capella2sysmlv2/transformation-instance-report.md"
          test -f "output/.capella2sysmlv2/transformation-meta-report.md"
          grep -F "sirius:///0fbf595a-7e8d-3814-a11b-12ba3223e7f7#" \
            "output/In-Flight Entertainment System.sysml.xmi"

      - name: Publish Linux mapping coverage summary
        if: always()
        shell: bash
        run: |
          if test -f "output/.capella2sysmlv2/transformation-meta-report.md"; then
            cat "output/.capella2sysmlv2/transformation-meta-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Linux qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-qualification-evidence
          path: |
            run.log
            output/In-Flight Entertainment System.sysml.xmi
            output/.capella2sysmlv2/transformation-instance-report.md
            output/.capella2sysmlv2/transformation-meta-report.md
          if-no-files-found: ignore
          retention-days: 7

  smoke-test-windows:
    name: Test Windows product
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: capella2sysmlv2-products
          path: dist

      - name: Extract Windows product
        shell: pwsh
        run: Expand-Archive -Path dist/capella2sysmlv2-Capella.7.1.0-windows-x86_64.zip -DestinationPath product

      - name: Transform IFE sample
        shell: pwsh
        run: |
          $lines = & .\product\capella2sysmlv2c.exe `
            -vm "$env:JAVA_HOME\bin\java.exe" `
            dist\InFlightEntertainmentSystem.zip output 2>&1
          $exitCode = $LASTEXITCODE
          $lines | Tee-Object -FilePath run.log
          if ($exitCode -ne 0) {
            throw "capella2sysmlv2 exited with code $exitCode"
          }

          $log = $lines -join "`n"
          @(
            "Source LogicalComponent count: 23",
            "Source Entity count: 8",
            "Source SystemComponent count: 5",
            "Source PhysicalComponent count: 64",
            "Generated PartUsage count: 100",
            "Errors: 0",
            "Capella Transformation Coverage:",
            "Arcadia SysML v2 Library Utilization:",
            "Arcadia SysML v2 Library Coverage of Capella:"
          ) | ForEach-Object {
            if (-not $log.Contains($_)) {
              throw "Missing expected output: $_"
            }
          }

          $xmi = "output\In-Flight Entertainment System.sysml.xmi"
          if (-not (Test-Path -Path $xmi -PathType Leaf)) {
            throw "Missing generated model: $xmi"
          }
          if (-not (Select-String -Path $xmi -SimpleMatch "sirius:///0fbf595a-7e8d-3814-a11b-12ba3223e7f7#" -Quiet)) {
            throw "Generated model does not reference the Arcadia library"
          }
          @(
            "output\.capella2sysmlv2\transformation-instance-report.md",
            "output\.capella2sysmlv2\transformation-meta-report.md"
          ) | ForEach-Object {
            if (-not (Test-Path -Path $_ -PathType Leaf)) {
              throw "Missing mapping coverage evidence: $_"
            }
          }

      - name: Publish Windows mapping coverage summary
        if: always()
        shell: pwsh
        run: |
          $report = "output\.capella2sysmlv2\transformation-meta-report.md"
          if (Test-Path -Path $report -PathType Leaf) {
            Get-Content -Path $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qualification-evidence
          path: |
            run.log
            output/In-Flight Entertainment System.sysml.xmi
            output/.capella2sysmlv2/transformation-instance-report.md
            output/.capella2sysmlv2/transformation-meta-report.md
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - smoke-test-linux
      - smoke-test-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: capella2sysmlv2-products
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # To add to the following 'run' section
          # dist/capella2sysmlv2-Capella.6.1.0-linux-x86_64.tar.gz
          # dist/capella2sysmlv2-Capella.6.1.0-windows-x86_64.zip
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/capella2sysmlv2-Capella.7.1.0-linux-x86_64.tar.gz
          dist/capella2sysmlv2-Capella.7.1.0-windows-x86_64.zip
          dist/capella2sysmlv2-Capella.7.0.1-linux-x86_64.tar.gz
          dist/capella2sysmlv2-Capella.7.0.1-windows-x86_64.zip
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Capella SysMLv2 Bridge $GITHUB_REF_NAME"
